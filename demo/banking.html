<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Banking</title><style>body{margin:0;background:#eef3f8;font-family:Inter,Arial,sans-serif;color:#17324d}.top{background:#073b68;color:#fff;padding:18px 8%;font-weight:700;font-size:20px}.wrap{max-width:850px;margin:38px auto;display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 7px 24px #17324d18}h1{margin:0 0 5px;font-size:26px}.muted{color:#607286}.field{margin-top:16px}.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.field input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:7px;font-size:15px;background:#fbfdff}.actions{display:flex;gap:10px;margin-top:24px}button{border:0;border-radius:7px;padding:11px 17px;font-weight:700;cursor:pointer;background:#0878c9;color:#fff}button.secondary{background:#e5eef6;color:#123a5c}.notice{border-left:4px solid #21a367;padding:13px;background:#effaf4;border-radius:4px;font-size:13px}.balance{font-size:28px;font-weight:800;margin:14px 0}.agent-orbit-redacted{background:#fff4cc!important}</style></head>
<body><div class="top">ORBIT BANK <span style="float:right;font-size:13px">Secure customer portal</span></div><div class="wrap"><section class="card"><h1>Account verification</h1><p class="muted">Review your details before continuing.</p><form id="banking-form" onsubmit="event.preventDefault();document.getElementById('result').textContent='Form submitted locally — no data was sent.'"><div class="field"><label for="name">Name</label><input id="name" name="name" value="Team Eclipse"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="eclipse@example.com"></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" value="+91 9876543210"></div><div class="field"><label for="account">Account Number</label><input id="account" name="account" value="123456789012"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" value="SuperSecret123"></div><div class="field"><label for="city">Preferred branch (normal)</label><input id="city" name="city" value="Bengaluru"></div><div class="actions"><button type="submit">Submit</button><button type="button" class="secondary">Continue</button></div></form><p id="result" class="muted"></p></section><aside class="card"><div class="notice">Demo-only page. It never sends form data anywhere.</div><p class="muted">Available balance</p><div class="balance">₹ 24,500.00</div><button type="button">Show Balance</button><p class="muted">Last updated today</p></aside></div></body></html>
